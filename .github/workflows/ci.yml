name: CI/CD Pipeline & Deploy Ping

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore AltevaCrawler.slnx

      - name: Build Solution
        run: dotnet build AltevaCrawler.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test AltevaCrawler.slnx --configuration Release --no-build --verbosity normal

  frontend-build:
    name: Build React UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI Dependencies
        run: |
          cd src/AltevaCrawler.Ui
          npm ci || npm install

      - name: Build Frontend
        run: |
          cd src/AltevaCrawler.Ui
          npm run build

  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: docker compose build

  ping-deploy:
    name: Ping Deployment Webhook
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Send Deploy Ping to Server
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL secret is not set. Skipping ping."
            exit 0
          fi
          echo "Sending deployment trigger to $WEBHOOK_URL..."
          curl -f -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"ref": "'"$GITHUB_REF"'", "sha": "'"$GITHUB_SHA"'"}'
