version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: alteva-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: alteva_crawler
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: alteva-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  crawl-api:
    build:
      context: .
      dockerfile: src/AltevaCrawler.Api/Dockerfile
    container_name: alteva-crawl-api
    ports:
      - "5000:80"
    environment:
      ASPNETCORE_HTTP_PORTS: "80"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=alteva_crawler;Uid=root;Pwd=rootpassword;"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
    volumes:
      - crawler_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  crawl-worker:
    build:
      context: .
      dockerfile: src/AltevaCrawler.Worker/Dockerfile
    container_name: alteva-crawl-worker
    environment:
      ASPNETCORE_HTTP_PORTS: "80"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=alteva_crawler;Uid=root;Pwd=rootpassword;"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
    volumes:
      - crawler_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  crawl-ui:
    build:
      context: .
      dockerfile: src/AltevaCrawler.Ui/Dockerfile
    container_name: alteva-crawl-ui
    ports:
      - "3000:80"
    depends_on:
      - crawl-api

  deploy-webhook:
    build:
      context: .
      dockerfile: scripts/Dockerfile.webhook
    container_name: alteva-deploy-webhook
    ports:
      - "127.0.0.1:9095:9000"
    environment:
      PORT: "9000"
      WEBHOOK_SECRET: "alteva-secret-token-2026"
      PROJECT_DIR: "/app"
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
      - /root/.ssh:/root/.ssh:ro
    restart: always

volumes:
  mysql_data:
  crawler_storage:
