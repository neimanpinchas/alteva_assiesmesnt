openapi: 3.0.3
info:
  title: Alteva Crawler API
  description: Distributed Job-Based Web Crawler REST API
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Local API Server

paths:
  /auth/token:
    post:
      summary: Issue stateless HMAC session token
      responses:
        '200':
          description: Token created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  sessionId:
                    type: string

  /jobs:
    post:
      summary: Create new crawl job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '200':
          description: Job created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
    get:
      summary: List job history
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated job list

  /jobs/{id}:
    get:
      summary: Get job status and summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details
    delete:
      summary: Delete job and prune exclusive site pages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job deleted and exclusive pages pruned

  /jobs/{id}/tree:
    get:
      summary: Get hierarchical page tree (3 levels lazy-loaded)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: parentPageId
          in: query
          schema:
            type: integer
        - name: depth
          in: query
          schema:
            type: integer
            default: 3
      responses:
        '200':
          description: Hierarchical tree nodes

  /jobs/{id}/metrics:
    get:
      summary: Get Domain Link Ratio pie chart and page sharing metrics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job metrics

  /jobs/{id}/search:
    get:
      summary: SimHash keyword search within job pages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ranked search results

  /jobs/global-search:
    get:
      summary: Global SimHash search across all crawled web pages
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ranked global search results

  /jobs/{id}/pages/{pageId}/content:
    get:
      summary: Read safe plain text preview of stored HTML page
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Plain text content

  /jobs/{id}/pause:
    post:
      summary: Pause active crawl job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job paused

  /jobs/{id}/resume:
    post:
      summary: Resume paused crawl job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job resumed

  /jobs/{id}/cancel:
    post:
      summary: Cancel active crawl job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job canceled

components:
  schemas:
    CreateJobRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
        maxDepth:
          type: integer
          default: 2
        maxPagesLimit:
          type: integer
          default: 200
